<title>Vigie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
/* Lecture avant tout : fond blanc, grands résumés en serif, rubriques à gauche, articles espacés et groupés par jour. */
:root {
  --bg: #ffffff; --panel: #ffffff; --fg: #1c2340; --muted: #5b6480; --line: #e4e7f0; --ink: #1c2340; --on-ink: #ffffff; --on-ink-muted: #c5cbe3;
  --rgpd: #3d4fc4; --numerique: #0f7a78; --sante: #b5345c; --cyber: #a85c00; --all: #1c2340; --alert: #c02626;
  --display: "Source Serif 4", Georgia, serif;
  --body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --reading: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12162a; --panel: #1a1f38; --fg: #e8ebf7; --muted: #9aa3c2; --line: #2e3555; --ink: #0b0e1d; --on-ink: #ffffff; --on-ink-muted: #aab2d2;
  --rgpd: #93a1ff; --numerique: #4cc9c5; --sante: #f28aa9; --cyber: #eeab55; --all: #e8ebf7; --alert: #ff7b7b; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12162a; --panel: #1a1f38; --fg: #e8ebf7; --muted: #9aa3c2; --line: #2e3555; --ink: #0b0e1d; --on-ink: #ffffff; --on-ink-muted: #aab2d2;
  --rgpd: #93a1ff; --numerique: #4cc9c5; --sante: #f28aa9; --cyber: #eeab55; --all: #e8ebf7; --alert: #ff7b7b; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--body); }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--rgpd); outline-offset: 2px; }
.mast { background: var(--ink); color: var(--on-ink); }
.mast-in, .wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mast { padding-top: env(safe-area-inset-top, 0px); }
.mast-in { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; padding-block: 20px; }
h1 { margin: 0; font: 700 34px/1.1 var(--display); letter-spacing: -.01em; }
.mast p { margin: 0; color: var(--on-ink-muted); font: 15px/1.5 var(--body); }
.wrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 56px; padding-block: 32px calc(64px + env(safe-area-inset-bottom, 0px)); }
aside { display: flex; flex-direction: column; gap: 20px; align-self: start; position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); }
.label { margin: 0 0 8px; font: 600 13px/1.4 var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.topics { display: flex; flex-direction: column; gap: 2px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.topic { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 9px; border-radius: 5px; text-align: left; font-weight: 500; }
.topic:hover { background: var(--line); }
.topic[aria-pressed="true"] { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.swatch { width: 10px; height: 10px; flex: none; background: var(--c); }
.topic b { margin-left: auto; font: 400 14px var(--body); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { min-height: 34px; padding: 4px 11px; border: 1px solid var(--line); border-radius: 99px; font-size: 13px; color: var(--muted); }
.chip:hover { color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.filters { display: flex; flex-direction: column; gap: 20px; }
summary.label { display: none; cursor: pointer; margin: 0; }
.side-link { font-size: 13px; color: var(--muted); }
#q { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--fg); font: inherit; }
.tally { margin: 14px 0 0; font: 14px var(--body); color: var(--muted); }
.day { margin: 40px 0 0; padding-bottom: 8px; border-bottom: 2px solid var(--fg); font: 700 20px var(--display); }
.day:first-letter { text-transform: uppercase; }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 28px 0; border-bottom: 1px solid var(--line); }
.entry.read h3 a { color: var(--muted); font-weight: 500; }
.tags { display: flex; flex-wrap: wrap; gap: 4px 14px; grid-column: 1 / -1; font: 600 14px/1.5 var(--body); }
.t { color: var(--c); }
.n { color: var(--muted); }
.n.hot { color: var(--alert); }
h3 { margin: 2px 0 0; font: 600 22px/1.3 var(--display); text-wrap: pretty; overflow-wrap: anywhere; }
h3 a { text-decoration: none; }
h3 a:hover { text-decoration: underline; }
.new { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--alert); vertical-align: 2px; }
.save { align-self: start; min-width: 44px; min-height: 44px; padding: 2px 4px; font-size: 20px; line-height: 1; color: var(--muted); }
.save[aria-pressed="true"] { color: var(--cyber); }
.sum { grid-column: 1 / -1; margin: 6px 0 0; max-width: 66ch; font: 18px/1.65 var(--reading); overflow-wrap: anywhere; }
.src { grid-column: 1 / -1; margin-top: 6px; font: 14px var(--body); color: var(--muted); }
.notif { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); }
.notif button { align-self: flex-start; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; color: var(--fg); font-weight: 600; }
.notif textarea { width: 100%; height: 90px; padding: 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, monospace; }
.empty { padding: 40px 0; color: var(--muted); }
.more { margin-top: 18px; padding: 9px 16px; border: 1px solid var(--line); border-radius: 5px; font-weight: 500; }
footer { margin-top: 36px; font: 14px/1.6 var(--body); color: var(--muted); }
@media (max-width: 800px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  h3 { font-size: 20px; }
  .sum { font-size: 17px; }
  aside { position: static; gap: 14px; }
  summary.label { display: list-item; }
  .filters { margin-top: 12px; }
  .topic { font-size: 15px; }
  .topics { flex-direction: row; flex-wrap: wrap; gap: 5px; }
  .topic { width: auto; padding: 5px 9px; box-shadow: inset 0 0 0 1px var(--line); }
  .topic b { margin-left: 2px; }
}
</style>

<header class="mast"><div class="mast-in">
  <h1>Vigie</h1>
  <p id="stamp"></p>
</div></header>

<div class="wrap">
  <aside>
    <nav><p class="label">Rubriques</p><div class="topics" id="topics"></div></nav>
    <details id="filters"><summary class="label">Filtres</summary><div class="filters">
    <div><p class="label">Nature</p><div class="chips" id="natures"></div></div>
    <div><p class="label">Affichage</p><div class="chips" id="views"></div></div>
    </div></details>
    <div class="notif" id="notif" hidden></div>
    <a class="side-link" href="newsletter/latest.html" target="_blank" rel="noopener">Lire la dernière lettre hebdomadaire</a>
  </aside>
  <main>
    <input id="q" type="search" placeholder="Rechercher : AIPD, sous-traitant, amende…" aria-label="Rechercher dans la veille">
    <p class="tally" id="tally" aria-live="polite"></p>
    <div id="list"></div>
    <button class="more" id="more" hidden>Afficher plus</button>
    <footer id="foot"></footer>
  </main>
</div>

<script>
const DATA = /*__DATA__*/null;
const TOPICS = Object.assign({ all: "Toutes les rubriques" }, DATA.labels);
const NATURES = ["Alerte", "Sanction", "Jurisprudence", "Texte", "Doctrine", "Fuite de données"];
const PAGE = 60;
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem("vigie." + key)) ?? fallback; } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem("vigie." + key, JSON.stringify(value)); } catch (e) {} },
};
const hash = location.hash.slice(1);
const state = {
  topic: TOPICS[hash] ? hash : "all", nature: null, official: false, savedOnly: false, q: "", limit: PAGE,
  saved: new Set(store.get("saved", [])), read: new Set(store.get("read", [])),
};
const lastVisit = store.get("visit", null);
store.set("visit", DATA.updated);

const $ = (id) => document.getElementById(id);
const el = (tag, props, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n; };
const fold = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const paris = (opts, d) => new Intl.DateTimeFormat("fr-FR", Object.assign({ timeZone: "Europe/Paris" }, opts)).format(d);
const articles = DATA.articles.map((a) => Object.assign(a, { d: new Date(a.date), hay: fold(a.title + " " + a.summary + " " + a.source) }));

function chosen(ignoreTopic) {
  const words = fold(state.q).split(/\s+/).filter(Boolean);
  return articles.filter((a) =>
    (ignoreTopic || state.topic === "all" || a.topics.includes(state.topic)) &&
    (!state.nature || a.natures.includes(state.nature)) && (!state.official || a.official) &&
    (!state.savedOnly || state.saved.has(a.id)) && words.every((w) => a.hay.includes(w)));
}

function controls() {
  const counted = chosen(true);
  $("topics").replaceChildren(...Object.entries(TOPICS).map(([key, label]) => {
    const count = key === "all" ? counted.length : counted.filter((a) => a.topics.includes(key)).length;
    const b = el("button", { className: "topic", onclick() { state.topic = key; state.limit = PAGE; history.replaceState(null, "", key === "all" ? "#" : "#" + key); render(); } },
      el("span", { className: "swatch" }), label, el("b", { textContent: count }));
    b.style.setProperty("--c", `var(--${key})`);
    b.setAttribute("aria-pressed", state.topic === key);
    return b;
  }));
  const chip = (label, on, click) => { const b = el("button", { className: "chip", textContent: label, onclick() { click(); state.limit = PAGE; render(); } }); b.setAttribute("aria-pressed", on); return b; };
  $("natures").replaceChildren(...NATURES.map((n) => chip(n, state.nature === n, () => { state.nature = state.nature === n ? null : n; })));
  $("views").replaceChildren(
    chip("Sources officielles", state.official, () => { state.official = !state.official; }),
    chip(`À relire (${state.saved.size})`, state.savedOnly, () => { state.savedOnly = !state.savedOnly; }));
}

function entry(a) {
  const tags = el("div", { className: "tags" });
  a.topics.forEach((t) => { const s = el("span", { className: "t", textContent: DATA.labels[t] }); s.style.setProperty("--c", `var(--${t})`); tags.append(s); });
  a.natures.forEach((n) => tags.append(el("span", { className: "n" + (n === "Alerte" ? " hot" : ""), textContent: n })));
  const link = el("a", { href: a.link, target: "_blank", rel: "noopener noreferrer", textContent: a.title,
    onclick() { state.read.add(a.id); store.set("read", [...state.read].slice(-3000)); row.classList.add("read"); } });
  const heading = el("h3");
  if (lastVisit && a.date > lastVisit) heading.append(el("span", { className: "new", title: "Nouveau depuis votre dernière visite" }));
  heading.append(link);
  const save = el("button", { className: "save", textContent: state.saved.has(a.id) ? "★" : "☆", title: "Garder à relire", onclick() {
    state.saved.has(a.id) ? state.saved.delete(a.id) : state.saved.add(a.id);
    store.set("saved", [...state.saved]); render();
  } });
  save.setAttribute("aria-pressed", state.saved.has(a.id));
  save.setAttribute("aria-label", "Garder à relire");
  const meta = [paris({ hour: "2-digit", minute: "2-digit" }, a.d), a.source];
  if (a.official) meta.push("officiel");
  if (a.lang === "en") meta.push("en anglais");
  const row = el("article", { className: "entry" + (state.read.has(a.id) ? " read" : "") }, tags, heading, save);
  if (a.summary) row.append(el("p", { className: "sum", textContent: a.summary }));
  row.append(el("div", { className: "src", textContent: meta.join(" · ") }));
  return row;
}

function render() {
  controls();
  const found = chosen(false);
  $("tally").textContent = found.length + (found.length > 1 ? " actualités" : " actualité") + " sur les 7 derniers jours";
  const nodes = [];
  let day = "";
  found.slice(0, state.limit).forEach((a) => {
    const label = paris({ weekday: "long", day: "numeric", month: "long", year: "numeric" }, a.d);
    if (label !== day) { day = label; nodes.push(el("h2", { className: "day", textContent: label })); }
    nodes.push(entry(a));
  });
  if (!found.length) nodes.push(el("p", { className: "empty", textContent: "Aucune actualité pour ces filtres cette semaine. Retirez un filtre pour en voir plus." }));
  $("list").replaceChildren(...nodes);
  $("more").hidden = found.length <= state.limit;
}

$("q").addEventListener("input", (e) => { state.q = e.target.value; state.limit = PAGE; render(); });
$("more").addEventListener("click", () => { state.limit += PAGE; render(); });
$("stamp").textContent = "Veille DPO · mis à jour le " + paris({ day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }, new Date(DATA.updated));
const ok = DATA.sources.filter((s) => s.ok).length;
const down = DATA.sources.filter((s) => !s.ok).map((s) => s.name);
$("foot").textContent = `${ok} flux sur ${DATA.sources.length} relevés lors de la dernière collecte.` + (down.length ? ` Indisponibles : ${[...new Set(down)].join(", ")}.` : "") + " Titres et courts extraits appartiennent à leurs éditeurs ; vérifiez toujours à la source.";
async function notifications() {
  const box = $("notif");
  if (!DATA.vapid || !("serviceWorker" in navigator)) return;
  const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  box.hidden = false;
  if (!installed && /iPhone|iPad/.test(navigator.userAgent)) {
    box.textContent = "Pour recevoir les notifications de 8 h et 18 h : dans Safari, touchez Partager puis « Sur l'écran d'accueil », et ouvrez Vigie depuis cette icône.";
    return;
  }
  if (!("PushManager" in window)) { box.hidden = true; return; }
  const button = el("button", { textContent: "Activer les notifications de 8 h et 18 h" });
  box.replaceChildren(button);
  button.onclick = async () => {
    try {
      if (await Notification.requestPermission() !== "granted") {
        box.textContent = "Notifications refusées. Autorisez-les dans Réglages, Notifications, Vigie, puis rouvrez l'application.";
        return;
      }
      const registration = await navigator.serviceWorker.ready;
      const key = Uint8Array.from(atob(DATA.vapid.replace(/-/g, "+").replace(/_/g, "/").padEnd(88, "=")), (c) => c.charCodeAt(0));
      const subscription = await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
      const code = el("textarea", { id: "notif-code", readOnly: true, value: JSON.stringify(subscription) });
      const copy = el("button", { textContent: "Copier le code", onclick() { navigator.clipboard.writeText(code.value).then(() => { copy.textContent = "Code copié"; }, () => code.select()); } });
      box.replaceChildren("Dernière étape : envoyez ce code à la personne qui gère Vigie.", code, copy);
    } catch (e) {
      box.textContent = "L'activation a échoué. Fermez puis rouvrez Vigie et réessayez.";
    }
  };
}

notifications();
$("filters").open = matchMedia("(min-width: 801px)").matches;
render();
</script>
